auths:
  public_v2:
    version: 2
    community: public

modules:
  if_mib:
    # We changed "walk" to "get" and added the exact index numbers (.0 and .1)
    get:
      - 1.3.6.1.2.1.1.3.0       # sysUpTime
      - 1.3.6.1.2.1.2.2.1.10.1  # ifInOctets (Interface 1)
      - 1.3.6.1.2.1.2.2.1.16.1  # ifOutOctets (Interface 1)
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: "System Uptime"
      - name: ifInOctets
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: "Incoming Traffic"
      - name: ifOutOctets
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: "Outgoing Traffic"